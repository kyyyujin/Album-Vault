function updateAllTrackScores() {
  const btn = document.getElementById('dbsync-update-scores-btn');
  btn.disabled = true;
  btn.textContent = '⌛ Actualizando…';

  // Safety timeout — reset after 5s if stuck
  const timeout = setTimeout(() => {
    btn.disabled = false;
    btn.textContent = '🔄 Actualizar scores de tracks';
  }, 5000);

  let updated = 0;
  try {
    dbSyncItems.forEach(item => {
      if (!item.trackScores || !Object.keys(item.trackScores).length) return;
      const existing = albums.find(a =>
        a.title.trim().toLowerCase()  === item.title.trim().toLowerCase() &&
        a.artist.trim().toLowerCase() === item.artist.trim().toLowerCase()
      );
      if (!existing) return;
      existing.trackScores = item.trackScores;
      updated++;
    });

    if (updated) {
      saveAlbums();
      showToast(`✓ ${updated} álbum${updated !== 1 ? 'es' : ''} actualizados`);
    } else {
      showToast('No se encontraron álbumes para actualizar');
    }
  } catch(e) {
    console.error(e);
    showToast('Error al actualizar');
  }

  clearTimeout(timeout);
  btn.disabled = false;
  btn.textContent = '🔄 Actualizar scores de tracks';
}

async function fetchFromRaterDb() {
  const userId = document.getElementById('dbsync-user-input').value.trim();
  if (!userId) { document.getElementById('dbsync-status').textContent = '⚠ Ingresa tu nombre de usuario.'; return; }

  localStorage.setItem('discord_user_id', userId);

  const btn = document.getElementById('dbsync-fetch-btn');
  btn.disabled = true;
  btn.textContent = '…';
  document.getElementById('dbsync-status').textContent = 'Buscando en la base de datos…';
  document.getElementById('dbsync-list').innerHTML = '';
  document.getElementById('dbsync-actions').style.display = 'none';
  dbSyncItems = [];
  dbSyncSelected.clear();

  try {
    let res;
    const statusEl = document.getElementById('dbsync-status');

    // Try fetching — if it fails (Render sleeping), wait and retry
    const attemptFetch = async (attempt) => {
      if (attempt > 1) {
        statusEl.textContent = `⏳ El servidor está despertando… intentando de nuevo (${attempt}/3)`;
        await new Promise(r => setTimeout(r, attempt === 2 ? 8000 : 12000));
      }
      return fetch(`${RATER_BOT_SERVER}/history?user_id=${encodeURIComponent(userId)}`, { signal: AbortSignal.timeout(25000) });
    };

    for (let i = 1; i <= 3; i++) {
      try {
        res = await attemptFetch(i);
        if (res.ok) break;
      } catch(e) {
        if (i === 3) throw e;
      }
    }

    if (!res || !res.ok) throw new Error(`Error del servidor: ${res?.status}`);
    const rows = await res.json();
    if (!Array.isArray(rows) || !rows.length) {
      document.getElementById('dbsync-status').textContent = 'No se encontraron álbumes para ese usuario.';
      btn.disabled = false; btn.textContent = '🔍 Buscar'; return;
    }

    // Convert DB rows to vault-compatible objects
    dbSyncItems = rows.map(row => {
      const score = parseFloat(row.final_score) || 0;
      let title = row.album_title || '';
      if (!title && row.title) {
        // strip Discord format "- TITLE [ARTIST]"
        title = row.title.replace(/^-\s*/, '').replace(/\s*\[.*\]$/, '').trim();
      }
      const tier = getTier(score);
      return {
        _dbId: row.id,
        title,
        artist:    row.artist    || '',
        year:      row.year      || '',
        genre:     row.genre     || '',
        coverUrl:  row.cover_url || '',
        coverScore: row.cover_score === null || row.cover_score === undefined || row.cover_score === '' ? null : parseFloat(row.cover_score),
        score,
        tier,
        finalRank: row.final_rank || tier?.label || '',
        tracks:    Array.isArray(row.tracks) ? row.tracks.map(t => t.name || '').filter(Boolean) : [],
        trackScores: Array.isArray(row.tracks) ? Object.fromEntries(row.tracks.filter(t => t.name && t.score !== '').map(t => [t.name.trim(), parseFloat(t.score)])) : {},
        notes:     row.notes || '',
        listenDate: row.created_at ? new Date(row.created_at).toISOString().slice(0,10) : '',
        addedAt:   row.created_at ? new Date(row.created_at).getTime() : Date.now(),
        status:    'listened',
        genres:    row.genre ? cleanGenres(row.genre.split(/[,/]/)) : [],
      };
    });

    document.getElementById('dbsync-status').textContent = `${dbSyncItems.length} álbum${dbSyncItems.length !== 1 ? 'es' : ''} encontrado${dbSyncItems.length !== 1 ? 's' : ''}.`;
    renderDbSyncList();
    btn.disabled = false; btn.textContent = '🔍 Buscar';
  } catch(e) {
    document.getElementById('dbsync-status').textContent = '⚠ No se pudo conectar con el servidor. Intentá de nuevo en unos segundos.';
    btn.disabled = false; btn.textContent = '🔍 Buscar';
  }
}

function getVaultDuplicate(item) {
  return albums.find(a =>
    a.title.trim().toLowerCase() === item.title.trim().toLowerCase() &&
    a.artist.trim().toLowerCase() === item.artist.trim().toLowerCase()
  ) || null;
}
function hasReviewUpdate(item, existing) {
  const incoming = (item.notes || '').trim();
  return !!incoming && incoming !== (existing?.notes || '').trim();
}
function isAlreadyInVault(item) {
  const dup = getVaultDuplicate(item);
  if (!dup) return false;
  // Un score igual solo está al día si tampoco llegó una reseña nueva desde Rater.
  return Math.abs(dup.score - item.score) < 0.001 && !hasReviewUpdate(item, dup);
}
function isUpdateAvailable(item) {
  const dup = getVaultDuplicate(item);
  return !!dup && (
    Math.abs(parseFloat(item.score) - parseFloat(dup.score)) >= 0.001 ||
    hasReviewUpdate(item, dup)
  );
}
function hasScoreUpdate(item, existing = getVaultDuplicate(item)) {
  return !!existing && Math.abs(parseFloat(item.score) - parseFloat(existing.score)) >= 0.001;
}
function shouldShowInDbSync(item) {
  const existing = getVaultDuplicate(item);
  // No repitas álbumes ya sincronizados, pero sí ofrecé cualquier cambio que
  // todavía no llegó al Vault: un re-score o una reseña nueva/editada.
  return !existing || hasScoreUpdate(item, existing) || hasReviewUpdate(item, existing);
}

function renderDbSyncList() {
  const list = document.getElementById('dbsync-list');
  list.innerHTML = '';

  if (!dbSyncItems.length) return;

  // Only offer albums that are new to this Vault or have a new final score.
  const visibleItems = dbSyncItems
    .map((item, i) => ({ item, i }))
    .filter(({ item }) => shouldShowInDbSync(item));

  dbSyncSelected.clear();
  visibleItems.forEach(({ i }) => dbSyncSelected.add(i));

  if (!visibleItems.length) {
    document.getElementById('dbsync-status').textContent = 'Todos tus álbumes de la base ya están al día en el Vault.';
    document.getElementById('dbsync-actions').style.display = 'none';
    return;
  }

  document.getElementById('dbsync-status').textContent = visibleItems.length + ' álbum' + (visibleItems.length !== 1 ? 'es' : '') + ' nuevo' + (visibleItems.length !== 1 ? 's' : '') + ' o con actualización disponible' + (visibleItems.length !== 1 ? 's' : '') + '.';

  visibleItems.forEach(({ item, i }) => {
    const alreadyIn    = isAlreadyInVault(item);
    const updateAvail  = isUpdateAvailable(item);
    const selected     = dbSyncSelected.has(i);
    const tier         = item.tier;

    const div = document.createElement('div');
    div.className = 'dbsync-item' + (alreadyIn ? ' already-in' : updateAvail ? ' update-available' : '');

    if (item.coverUrl) {
      const bg = document.createElement('div');
      bg.className = 'dbsync-item-bg';
      bg.style.backgroundImage = `url('${item.coverUrl}')`;
      div.appendChild(bg);
    }

    const checkEl = document.createElement('div');
    checkEl.className = 'dbsync-check' +
      (alreadyIn  ? ' already-in-check' :
       updateAvail ? ' update-check' + (selected ? ' selected' : '') :
       (selected ? ' selected' : ''));
    checkEl.textContent = (selected || alreadyIn) ? '✓' : (updateAvail ? '↑' : '');

    if (!alreadyIn) {
      checkEl.addEventListener('click', () => {
        if (dbSyncSelected.has(i)) {
          dbSyncSelected.delete(i);
          checkEl.classList.remove('selected');
          checkEl.textContent = updateAvail ? '↑' : '';
        } else {
          dbSyncSelected.add(i);
          checkEl.classList.add('selected');
          checkEl.textContent = '✓';
        }
        updateDbSyncCount();
      });
    }

    const thumb = document.createElement('img');
    thumb.className = 'dbsync-thumb';
    thumb.src = item.coverUrl || '';
    thumb.onerror = function() { this.style.visibility='hidden'; };

    const info = document.createElement('div');
    info.className = 'dbsync-info';
    info.innerHTML = `
      <div class="dbsync-title">${escHtml(item.title)}</div>
      <div class="dbsync-meta">${escHtml(item.artist)}${item.year ? ' · ' + item.year : ''}${item.genre ? ' · ' + item.genre : ''}</div>`;

    const tierEl = document.createElement('div');
    tierEl.className = 'dbsync-tier';
    tierEl.style.color = tier?.color || '#888';
    tierEl.textContent = tier?.label || '?';

    const scoreEl = document.createElement('div');
    scoreEl.className = 'dbsync-score';
    scoreEl.style.color = tier?.color || '#888';
    scoreEl.textContent = item.score.toFixed(2);

    if (alreadyIn) {
      const tag = document.createElement('div');
      tag.className = 'dbsync-already-tag';
      tag.textContent = '✓ ya en Vault';
      div.appendChild(checkEl);
      div.appendChild(thumb);
      div.appendChild(info);
      div.appendChild(tierEl);
      div.appendChild(scoreEl);
      div.appendChild(tag);
    } else if (updateAvail) {
      const existing = getVaultDuplicate(item);
      const tag = document.createElement('div');
      tag.className = 'dbsync-update-tag';
      const scoreChanged = Math.abs(parseFloat(existing.score) - parseFloat(item.score)) >= 0.001;
      tag.textContent = scoreChanged
        ? `↑ ${existing.score.toFixed(2)} → ${item.score.toFixed(2)}`
        : '✎ reseña actualizada';
      div.appendChild(checkEl);
      div.appendChild(thumb);
      div.appendChild(info);
      div.appendChild(tierEl);
      div.appendChild(scoreEl);
      div.appendChild(tag);
    } else {
      div.appendChild(checkEl);
      div.appendChild(thumb);
      div.appendChild(info);
      div.appendChild(tierEl);
      div.appendChild(scoreEl);
    }

    // Click row to toggle (if not already in vault)
    if (!alreadyIn) {
      div.addEventListener('click', e => {
        if (e.target === checkEl) return;
        checkEl.click();
      });
    }

    list.appendChild(div);
  });

  document.getElementById('dbsync-actions').style.display = 'flex';
  updateDbSyncCount();
}

function updateDbSyncCount() {
  const count = dbSyncSelected.size;
  document.getElementById('dbsync-count').textContent = count > 0 ? `${count} seleccionado${count !== 1 ? 's' : ''}` : '';
  document.getElementById('dbsync-import-btn').disabled = count === 0;
}

// Select all / deselect all
document.getElementById('dbsync-select-all').addEventListener('click', () => {
  const allSelectable = dbSyncItems.map((item, i) => ({ item, i })).filter(({ item }) => shouldShowInDbSync(item));
  const allSelected = allSelectable.every(({ i }) => dbSyncSelected.has(i));
  if (allSelected) {
    allSelectable.forEach(({ i }) => dbSyncSelected.delete(i));
  } else {
    allSelectable.forEach(({ i }) => dbSyncSelected.add(i));
  }
  renderDbSyncList();
});

// Import selected
document.getElementById('dbsync-import-btn').addEventListener('click', () => {
  if (!dbSyncSelected.size) return;

  let added = 0, updated = 0;
  const importedAlbums = [];
  const importAchievementEvents = [];
  dbSyncSelected.forEach(i => {
    const item = dbSyncItems[i];
    if (!item) return;

    const existing = getVaultDuplicate(item);

    const scoreChanged = existing && Math.abs(parseFloat(existing.score) - parseFloat(item.score)) >= 0.001;
    const reviewChanged = existing && hasReviewUpdate(item, existing);
    if (existing && !scoreChanged && !reviewChanged) return;

    if (existing) {
      if (scoreChanged) {
        const scoreBeforeImport = parseFloat(existing.score);
        // Save score history only when the score really changed.
        if (!existing.scoreHistory) existing.scoreHistory = [];
        const lastEntry = existing.scoreHistory[existing.scoreHistory.length - 1];
        if (!lastEntry || Math.abs(lastEntry.score - parseFloat(existing.score)) >= 0.001) {
          existing.scoreHistory.push({
            score: parseFloat(existing.score),
            date:  existing.listenDate || new Date().toISOString().slice(0,10),
            label: 'Antes del re-score'
          });
        }
        existing.scoreHistory.push({
          score: parseFloat(item.score),
          date:  item.listenDate || new Date().toISOString().slice(0,10),
          label: 'Re-score desde Rater DB'
        });
        existing.score       = parseFloat(item.score);
        existing.year        = item.year;
        existing.coverUrl    = item.coverUrl;
        existing.coverScore  = item.coverScore;
        existing.genres      = item.genres;
        existing.listenDate  = item.listenDate;
        existing.tracks      = item.tracks;
        existing.trackScores = item.trackScores || {};
        importAchievementEvents.push(makeAchievementEvent('album_rescored', existing, { previous_score:scoreBeforeImport, new_score:parseFloat(item.score), delta:Number((parseFloat(item.score)-scoreBeforeImport).toFixed(2)), previous_at:lastEntry?.timestamp || null }, 'rater'));
        importAchievementEvents.push(makeAchievementEvent('track_scores_saved', existing, {}, 'rater'));
      }
      if (reviewChanged) { existing.notes = item.notes.trim(); importAchievementEvents.push(makeAchievementEvent('review_updated',existing,{review_text:existing.notes},'rater')); }
      updated++;
    } else {
      const importedAlbum = {
        id:          Date.now() + Math.random(),
        title:       item.title,
        artist:      item.artist,
        year:        item.year,
        score:       parseFloat(item.score),
        coverUrl:    item.coverUrl,
        coverScore:  item.coverScore,
        genres:      item.genres,
        status:      'listened',
        listenDate:  item.listenDate,
        addedAt:     item.addedAt,
        tracks:      item.tracks,
        trackScores: item.trackScores || {},
        notes:       item.notes,
        replays:     [],
        scoreHistory:[{ score: parseFloat(item.score), date: item.listenDate, label: 'Importado desde Rater DB' }],
        _dbId:       item._dbId,
      };
      albums.push(importedAlbum);
      importedAlbums.push(importedAlbum);
      importAchievementEvents.push(makeAchievementEvent('album_added',importedAlbum,{},'rater'));
      importAchievementEvents.push(makeAchievementEvent('album_rated',importedAlbum,{score:parseFloat(importedAlbum.score)},'rater'));
      if (Object.keys(importedAlbum.trackScores||{}).length) importAchievementEvents.push(makeAchievementEvent('track_scores_saved',importedAlbum,{},'rater'));
      if (importedAlbum.notes) importAchievementEvents.push(makeAchievementEvent('review_written',importedAlbum,{review_text:importedAlbum.notes},'rater'));
      added++;
    }
  });

  if (importAchievementEvents.length) saveAlbumsWithAchievementEvents(importAchievementEvents); else saveAlbums();
  buildTiersWithReveal();
  refreshGenreFilter();
  closeDbSync();

  // Si importaste varios a la vez, celebramos la última incorporación sin
  // encadenar muchas ceremonias seguidas.
  if (importedAlbums.length) {
    setTimeout(() => playRatingCeremony(importedAlbums[importedAlbums.length - 1]), 120);
  }

  const parts = [];
  if (added)   parts.push(`${added} importado${added !== 1 ? 's' : ''}`);
  if (updated) parts.push(`${updated} actualizado${updated !== 1 ? 's' : ''}`);
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3ab870;color:#000;font-family:"DM Mono",monospace;font-size:12px;font-weight:600;padding:10px 24px;letter-spacing:1px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .3s';
  toast.textContent = `☁ ${parts.join(' · ')} desde la base de datos`;
  document.body.appendChild(toast);
  requestAnimationFrame(() => { toast.style.opacity = '1'; });
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
});
(function() {
  let lastY = 0;
  let ticking = false;
  const header = document.getElementById('header');
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        const y = window.scrollY;
        if (y > lastY && y > 80) {
          header.classList.add('hidden');
        } else {
          header.classList.remove('hidden');
        }
        lastY = y;
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
})();

const hint = document.getElementById('scroll-hint');

// ── INIT ──
// "Despertar" al bot en Render apenas se carga la página: un GET liviano a la raíz,
// disparado en paralelo sin esperar respuesta. Render duerme el servicio gratuito
// tras inactividad, y el primer request real (login, perfil, etc.) puede tardar
// varios segundos en ese caso — este ping adelanta ese arranque para cuando el
// usuario realmente lo necesite.
if (new URLSearchParams(location.search).get('guest') !== '1') fetch(`${BOT_SERVER}/`).catch(() => {});
loadAlbums();
checkAuth();
// Auto-arreglo de portadas rotas contra la DB del Rater — en segundo plano, no
// bloquea el render inicial ni se avisa al usuario si no encuentra nada.
if (!isGuestMode) autoRefreshBrokenCovers();
// Wire up the reveal version globally after everything is loaded

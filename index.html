  /* ══════════════ Efecto de carta holográfica (solo Favoritos) ══════════════ */
  .holo-scene {
    flex: 0 0 auto;
    width: 31%;
    min-width: 108px;
    max-width: 160px;
    scroll-snap-align: start;
    aspect-ratio: 2 / 3;
    perspective: 900px;
    /* Evita el menú nativo de "guardar/copiar imagen" al mantener presionado en
       móvil, y bloquea selección de texto/imagen accidental durante el gesto. */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  @media (max-width: 480px) {
    /* Una carta protagonista por vista: se alcanza a insinuar la siguiente al deslizar. */
    .holo-scene {
      width: 85%;
      min-width: 85%;
      max-width: 306px;
      scroll-snap-align: center;
      perspective: 1200px;
    }
    .holo-card {
      box-sizing: border-box;
      border: 2px solid rgba(var(--holo-dominant-rgb, 200,240,96), .9);
      box-shadow:
        0 14px 34px rgba(0,0,0,.62),
        0 0 10px rgba(var(--holo-dominant-rgb, 200,240,96), .72),
        0 0 28px rgba(var(--holo-dominant-rgb, 200,240,96), .38),
        inset 0 0 12px rgba(var(--holo-dominant-rgb, 200,240,96), .18);
    }
    .holo-scene.holo-idle:not(.holo-active) .holo-card {
      animation: holoIdleFloatMobile 24s cubic-bezier(.45, 0, .55, 1) infinite;
      will-change: transform;
      backface-visibility: hidden;

      opacity: .32;

    }

  @keyframes holoIdleFloatMobile {
    0%   { transform: translateZ(0) rotateX(.35deg)  rotateY(-.6deg) scale(.998); }
    25%  { transform: translateZ(0) rotateX(-.25deg) rotateY(.4deg)  scale(1); }
    50%  { transform: translateZ(0) rotateX(.4deg)   rotateY(.6deg)  scale(.999); }
    75%  { transform: translateZ(0) rotateX(-.3deg)  rotateY(-.45deg) scale(1); }
    100% { transform: translateZ(0) rotateX(.35deg)  rotateY(-.6deg) scale(.998); }
  }
  .holo-card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    background: #1a1a2a;
    transform-style: preserve-3d;
    transform-origin: var(--px, 50%) var(--py, 50%);
    transform:
      rotateX(var(--rx, 0deg))
      rotateY(var(--ry, 0deg))
      scale(var(--holo-scale, 1));
    box-shadow:
      0 8px 20px rgba(0,0,0,0.5),
      var(--holo-glow, 0 0 0 rgba(0,0,0,0));
    transition: transform .12s ease-out, box-shadow .2s ease-out;
  }
  .holo-scene:not(.holo-active) .holo-card {
    transition: transform .5s cubic-bezier(.23,1,.32,1), box-shadow .5s ease-out;
  }
  /* Flotación cuando nadie la está tocando: una oscilación continua marcada
     en vez del tilt quieto de --rx/--ry en 0. Se corta apenas se toca la carta
     (holo-active la pausa) para no competir con el tilt real del dedo/mouse. */
  .holo-scene.holo-idle:not(.holo-active) .holo-card {
    animation: holoIdleFloat 5.5s ease-in-out infinite;
    animation-delay: var(--holo-idle-delay, 0s);
  }
  @keyframes holoIdleFloat {
    0%   { transform: rotateX(7deg)   rotateY(-11deg) scale(1); }
    25%  { transform: rotateX(-6deg)  rotateY(9deg)    scale(1); }
    50%  { transform: rotateX(9deg)   rotateY(12deg)   scale(1); }
    75%  { transform: rotateX(-7deg)  rotateY(-9deg)   scale(1); }
    100% { transform: rotateX(7deg)   rotateY(-11deg)  scale(1); }
  }
  .holo-card img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Franja inferior difuminada, misma técnica que el resto de las tarjetas del perfil */
  .holo-card-bg {
    position: absolute;
    left: 0; right: 0; bottom: 0; height: 55%;
    background-size: cover;
    background-position: center bottom;
    filter: blur(18px) saturate(1.5) brightness(0.55);
    transform: scale(1.3);
    transform-origin: bottom center;
    pointer-events: none;
  }
  .holo-card-overlay {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 22px 10px 10px;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.75) 100%);
  }
  /* Brillo especular que sigue al puntero */
  .holo-shine {
    position: absolute; inset: 0;
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.85) 0%,
      rgba(255,255,255,0.25) 12%,
      transparent 45%
    );
    mix-blend-mode: overlay;
    opacity: 0;
    transition: opacity .25s ease-out;
    pointer-events: none;
  }
  /* Franjas de color estilo holográfico, también siguiendo al puntero */
  .holo-rainbow {
    position: absolute; inset: 0;
    background: linear-gradient(
      115deg,
      transparent 0%,
      rgba(255,90,180,0.5) 25%,
      rgba(255,210,80,0.5) 40%,
      rgba(90,220,255,0.5) 55%,
      rgba(170,110,255,0.5) 70%,
      transparent 100%
    );
    background-size: 250% 250%;
    background-position: var(--mx, 50%) var(--my, 50%);
    mix-blend-mode: color-dodge;
    opacity: 0;
    transition: opacity .25s ease-out;
    pointer-events: none;
  }
  .holo-scene.holo-active .holo-shine,
  .holo-scene.holo-active .holo-rainbow {
    opacity: var(--holo-intensity, 0.9);
  }
  /* Brillo ambiental marcado que recorre la carta solo, cuando no se está tocando */
  .holo-scene.holo-idle:not(.holo-active) .holo-shine {
    opacity: 0.65;
    animation: holoIdleShine 5.5s ease-in-out infinite;
    animation-delay: var(--holo-idle-delay, 0s);
  }
  .holo-scene.holo-idle:not(.holo-active) .holo-rainbow {
    opacity: 0.45;
    animation: holoIdleShine 5.5s ease-in-out infinite;
    animation-delay: var(--holo-idle-delay, 0s);
  }
  @keyframes holoIdleShine {
    0%   { background-position: 20% 30%; }
    25%  { background-position: 75% 20%; }
    50%  { background-position: 80% 75%; }
    75%  { background-position: 25% 80%; }
    100% { background-position: 20% 30%; }
  }
  .holo-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    position: relative;
  }
  .holo-score {
    font-family: 'DM Mono', monospace;

    font-weight: 700;
    margin-top: 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    position: relative;
  }

  /* Favoritos: reposo totalmente limpio. El tratamiento holográfico aparece solo
     cuando se pasa el cursor por encima de una carta. */
  .holo-scene.holo-idle:not(.holo-active) .holo-card,
  .holo-scene.holo-idle:not(.holo-active) .holo-shine,
  .holo-scene.holo-idle:not(.holo-active) .holo-rainbow {
    animation:none !important;
  }
  .holo-scene.holo-idle:not(.holo-active) .holo-shine,
  .holo-scene.holo-idle:not(.holo-active) .holo-rainbow { opacity:0 !important; }
  .holo-title {
    font-family:'Bebas Neue',sans-serif;

  .profile-album-grid {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 4px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .profile-album-grid::-webkit-scrollbar { display: none; }
  .profile-carousel-shell {
    position: relative;
    min-width: 0;
    isolation: isolate;
  }
  .profile-carousel-shell::before,
  .profile-carousel-shell::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 6;
    width: clamp(54px, 7vw, 110px);
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .profile-carousel-shell::before {
    left: 0;
    background: linear-gradient(90deg, var(--bg, #0a0a0a) 0%, rgba(10,10,10,.82) 28%, transparent 100%);
  }
  .profile-carousel-shell::after {
    right: 0;
    background: linear-gradient(270deg, var(--bg, #0a0a0a) 0%, rgba(10,10,10,.82) 28%, transparent 100%);
  }
  .profile-carousel-shell.can-scroll-left::before,
  .profile-carousel-shell.can-scroll-right::after {
    opacity: 1;
  }
  /* Favoritos usa cartas especiales: sin fade lateral para no tapar su glow. */
  .favorites-carousel-shell::before,
  .favorites-carousel-shell::after {
    display: none !important;
  }
  .profile-carousel-btn {
    position: absolute;
    top: 50%;
    z-index: 8;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, #333);
    background: rgba(10,10,12,0.86);
    backdrop-filter: blur(10px);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transform: translateY(-50%) scale(.92);
    transition: opacity .2s, transform .2s, background .2s, border-color .2s;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .profile-carousel-shell:hover .profile-carousel-btn:not(:disabled),
  .profile-carousel-btn:focus-visible {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }
  .profile-carousel-btn:hover {
    background: color-mix(in srgb, var(--accent) 16%, rgba(10,10,12,.94));
    border-color: var(--accent);
  }
  .profile-carousel-btn.prev { left: 10px; }
  .profile-carousel-btn.next { right: 10px; }
  .profile-carousel-btn:disabled {
    opacity: 0;
    pointer-events: none;
  }
  .profile-album-card {
    cursor: pointer;
    flex: 0 0 auto;
    width: 31%;
    min-width: 108px;
    max-width: 160px;
    scroll-snap-align: start;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 2 / 3;
    background: #1a1a2a;
  }
  .profile-album-card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Fondo difuminado de la propia carátula detrás del overlay, misma técnica que
     usa la exportación de imagen del Rater: no lee píxeles (no depende de CORS),
     solo renderiza la imagen agrandada con un filtro de blur. */
  .profile-card-bg {
    position: absolute;
    left: 0; right: 0; bottom: 0; height: 55%;
    background-size: cover;
    background-position: center bottom;
    filter: blur(18px) saturate(1.5) brightness(0.55);
    transform: scale(1.3);
    transform-origin: bottom center;
    pointer-events: none;
  }
  .profile-album-card-overlay {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 22px 10px 10px;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.75) 100%);
  }
  .profile-album-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    position: relative;
  }
  .profile-album-score {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    margin-top: 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    position: relative;
  }

  /* Favoritos conserva su carrusel, pero cada pieza ocupa media franja
     para darle a la selección un peso mucho más protagonista en escritorio. */
  @media (min-width: 900px) {
    .favorites-carousel-shell {
      width: 100%;
      max-width: none;
    }
    #profile-pinned-row {
      display: flex;
      gap: 28px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
    }
    #profile-pinned-row .holo-scene {
      width: calc((100% - 56px) / 3);
      min-width: calc((100% - 56px) / 3);
      max-width: none;
    }
  }

  /* En móvil el carrusel se mueve con el dedo: mantenemos los fades como pista visual,
     pero quitamos las flechas que tapaban las portadas. */
  @media (max-width: 899px) {
    .profile-carousel-btn { display: none; }
    .profile-album-card {
      width: 44vw;
      min-width: 150px;
      max-width: 190px;
    }
  }

  }

  /* replay history */
  #modal-replays { margin-bottom:18px; border-top:1px solid var(--border); padding-top:14px; }
  #modal-replays h4 { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .replay-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid #161616; font-size:10px; }
  .replay-row:last-child { border-bottom:none; }
  .replay-date { color:var(--muted); }
  .replay-actions { display:flex; gap:4px; margin-left:8px; opacity:0; transition:opacity .2s; }
  .replay-row:hover .replay-actions { opacity:1; }
  .replay-edit-btn, .replay-del-btn {
    background:none; border:none; cursor:pointer; font-size:10px; padding:2px 5px;
    font-family:'DM Mono',monospace; transition:color .15s;
  }
  .replay-edit-btn { color:var(--muted); }
  .replay-edit-btn:hover { color:var(--bp); }
  .replay-del-btn { color:#3a1a1a; }
  .replay-del-btn:hover { color:#e05252; }
  .replay-editing input[type="date"] {
    background:#1a1a1a; border:1px solid #3ab870; color:var(--text);
    padding:2px 6px; font-family:'DM Mono',monospace; font-size:10px; outline:none;
  }
  #btn-add-replay { background:none; border:1px solid #2a2a2a; color:var(--muted); padding:5px 12px; font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1.5px; cursor:pointer; margin-top:8px; transition:all .2s; }
  #btn-add-replay:hover { border-color:#444; color:var(--text); }
  /* external links */
  #modal-links { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .ext-link {
    font-size:9px; letter-spacing:1.5px; padding:5px 12px;
    border:1px solid #2a2a2a; color:var(--muted); text-decoration:none;
    transition:all .2s; display:inline-flex; align-items:center; gap:5px;
  }
  .ext-link:hover { border-color:#444; color:var(--text); }
  #modal-tracklist h4 { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .track-item { display:flex; gap:12px; padding:7px 0; border-bottom:1px solid #1a1a1a; font-size:11px; align-items:baseline; }
  .track-num { color:var(--muted); min-width:20px; text-align:right; }
  .track-name { flex:1; }
  .track-fav { color:var(--ss); font-size:9px; letter-spacing:1px; }
  #modal-close { position:absolute; top:14px; right:16px; background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; padding:4px 8px; transition:color .2s; }
  #modal-close:hover { color:var(--text); }
  #modal-actions { display:flex; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
  .modal-action-btn { flex:1; padding:9px 14px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; border:1px solid; transition:all .2s; }
  #btn-edit-album { background:transparent; border-color:#333; color:var(--muted); }
  #btn-edit-album:hover { border-color:var(--text); color:var(--text); }
  #btn-delete-album { background:transparent; border-color:#3a1a1a; color:#e05252; }
  #btn-delete-album:hover { background:#e05252; color:#fff; border-color:#e05252; }

  /* ── IMMERSIVE ALBUM DETAIL ──
     La portada deja de ser una miniatura dentro de un diálogo: es el espacio
     al que entra el usuario, con su color y textura extendidos por la pantalla. */
  #modal-backdrop { padding:0; }
  #modal {
    width:100%; max-width:none; height:100%; max-height:none; border:none;
    background:#0d0d10; overflow:hidden;
  }
  #modal-art-bg {
    position:absolute; inset:-42px; z-index:0; pointer-events:none;
    background-position:center; background-size:cover;
    filter:blur(34px) saturate(1.45) brightness(.32);
    transform:scale(1.09); opacity:.9;
  }
  #modal::after {
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(90deg,rgba(5,5,7,.18) 0%,rgba(5,5,7,.3) 44%,rgba(9,9,12,.94) 100%);
  }
  #modal > :not(#modal-art-bg) { position:relative; z-index:1; }
  #modal-cover-stage {
    width:clamp(320px,52vw,860px); min-width:0; height:100%; aspect-ratio:auto;
    position:relative; top:auto; align-self:stretch;
    box-shadow:22px 0 60px rgba(0,0,0,.32);
  }
  #modal-cover { width:100%; height:100%; object-fit:cover; }
  #modal-body {
    width:min(520px,48vw); min-width:0; padding:58px 42px 36px;
    background:linear-gradient(90deg,rgba(13,13,17,.84),rgba(13,13,17,.97));
    backdrop-filter:blur(16px);
  }
  /* Control propio del Vault: siempre flota por encima de la portada y del panel. */
  #modal > #modal-close {
    position:absolute; top:18px; right:22px; z-index:5;
    display:grid; place-items:center; width:44px; height:44px; padding:0;
    color:var(--text); font-family:'Bebas Neue',sans-serif; font-size:31px; line-height:1;
    border:1px solid rgba(232,228,220,.38); border-radius:12px 4px 12px 4px;
    background:linear-gradient(135deg,rgba(20,20,25,.94),rgba(7,7,10,.78));
    box-shadow:0 10px 30px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(12px); cursor:pointer; transition:transform .18s ease,background .18s ease,border-color .18s ease;
  }
  #modal > #modal-close:hover {
    transform:scale(1.08) rotate(4deg); color:#fff; border-color:var(--accent,#c8f060);
    background:rgba(200,240,96,.16);
  }
  #modal > #modal-close:active { transform:scale(.94); }
  #modal > #modal-close:focus-visible { outline:2px solid var(--accent,#c8f060); outline-offset:3px; }

  /* En escritorio la carátula es una columna cuadrada propia: determina su
     espacio y comparte exactamente la altura del panel de información. */
  @media (min-width:900px) {
    #modal {
      --modal-dominant-rgb: 200 240 96;
      width:min(92vw,1280px);
      height:min(62vw,74vh,720px);
      max-height:min(62vw,74vh,720px);
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      background:#0a0a0d;
      box-shadow:0 34px 100px rgba(0,0,0,.68);
    }
    /* Sin fondo independiente: la portada forma literalmente el lado izquierdo. */
    #modal-art-bg { display:none; }
    #modal::after { background:none; }
    #modal-cover-stage {
      flex:0 0 auto;
      width:auto;
      height:100%;
      aspect-ratio:1;
      align-self:stretch;
      background:transparent;
      box-shadow:none;
    }
    #modal-cover { width:100%; height:100%; object-fit:cover; object-position:center; }
    #modal-body {
      flex:1 1 auto;
      width:auto;
      height:100%;
      /* Panel sólido, sin capa ni degradado sobre la portada. */
      background:#0a0a0d;
      box-shadow:none;
    }
  }

  /* El score funciona como un sello de colección: conserva el color del tier y
     deja claro que es la pieza central del álbum. */
  #modal-score {
    position:relative; display:flex; align-items:center; justify-content:center;
    width:112px; height:112px; margin:14px 0 18px; padding:17px 8px 0;
    border:1px solid currentColor; border-radius:50%;
    background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.16),rgba(15,15,20,.92) 58%);
    box-shadow:0 0 0 6px rgba(0,0,0,.18),0 16px 32px rgba(0,0,0,.42),inset 0 0 18px rgba(0,0,0,.55);
    font-size:38px; letter-spacing:1px; transform:rotate(-4deg);
    text-shadow:0 2px 12px currentColor;
  }
  #modal-score::before {
    content:'VAULT SCORE'; position:absolute; top:19px; left:0; right:0;
    color:var(--text); opacity:.62; text-align:center; font-family:'DM Mono',monospace;
    font-size:7px; letter-spacing:1.8px; text-shadow:none;
  }
  #modal-score::after {
    content:''; position:absolute; inset:8px; border:1px dashed currentColor;
    border-radius:50%; opacity:.36; pointer-events:none;
  }
  #modal-score { isolation:isolate; }
  #modal-score::before { z-index:1; }
  @media (max-width:600px) { #modal-score { width:98px; height:98px; margin:12px 0 16px; font-size:34px; } }

  /* ── TIER CLIMATE ── */
  @keyframes tierClimateDrift {
    0%,100% { transform:translateY(-50%) scale(1); }
    50% { transform:translateY(-54%) scale(1.16); }
  }
  .tier-row::before { animation:tierClimateDrift 12s ease-in-out infinite; }
  .tier-row:has(.tier-label.in-view)::before {
    opacity:.15; filter:blur(88px); animation-duration:7s;
  }
  .tier-row:has(.tier-label.in-view) .tier-albums {
    background:linear-gradient(90deg,color-mix(in srgb,var(--tier-color) 5%,transparent),transparent 55%);
  }
  @media (prefers-reduced-motion:reduce) { .tier-row::before { animation:none; } }

  /* ── RATING CEREMONY ── */
  #rating-ceremony {
    position:fixed; inset:0; z-index:1200; display:none; align-items:center; justify-content:center;
    overflow:hidden; background:rgba(4,4,6,.96); isolation:isolate;
  }
  #rating-ceremony.active { display:flex; }
  #rating-ceremony::before {
    content:''; position:absolute; inset:-50px; z-index:-1; opacity:.42;
    background:var(--ceremony-cover) center/cover; filter:blur(42px) saturate(1.5) brightness(.42);
    transform:scale(1.12);
  }
  .ceremony-stage { width:min(320px,76vw); text-align:center; }
  .ceremony-cover {
    width:100%; aspect-ratio:1; object-fit:cover; display:block; border-radius:5px;
    box-shadow:0 28px 70px rgba(0,0,0,.58),0 0 0 1px rgba(255,255,255,.16);
    opacity:0; transform:scale(.78) translateY(20px);
  }
  .ceremony-overline { margin:18px 0 7px; color:#a3a3aa; font-size:9px; letter-spacing:3px; }
  .ceremony-title { color:#fff; font-family:'DM Serif Display',serif; font-size:23px; line-height:1.15; }
  .ceremony-seal {
    width:116px; height:116px; margin:24px auto 14px; border:1px solid var(--ceremony-tier);
    border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;
    background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.18),rgba(12,12,15,.92) 58%);
    color:var(--ceremony-tier); font-family:'Bebas Neue',sans-serif; font-size:42px;
    box-shadow:0 0 0 7px rgba(0,0,0,.22),0 18px 40px rgba(0,0,0,.5),0 0 30px color-mix(in srgb,var(--ceremony-tier) 30%,transparent);
    opacity:0; transform:scale(.55) rotate(-18deg);
  }
  .ceremony-seal::before { content:'VAULT SCORE'; position:absolute; top:21px; color:#fff; opacity:.62; font-family:'DM Mono',monospace; font-size:7px; letter-spacing:1.7px; }
  .ceremony-tier { color:var(--ceremony-tier); font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:5px; opacity:0; transform:translateY(12px); }
  #rating-ceremony.playing .ceremony-cover { animation:ceremonyCover .7s cubic-bezier(.22,1,.36,1) forwards; }
  #rating-ceremony.playing .ceremony-seal { animation:ceremonySeal .56s .76s cubic-bezier(.2,1.4,.4,1) forwards; }
  #rating-ceremony.playing .ceremony-tier { animation:ceremonyText .42s 1.36s ease forwards; }
  #rating-ceremony.leaving .ceremony-stage { animation:ceremonyExit .65s ease forwards; }
  @keyframes ceremonyCover { to { opacity:1; transform:scale(1) translateY(0); } }
  @keyframes ceremonySeal { to { opacity:1; transform:scale(1) rotate(-4deg); } }
  @keyframes ceremonyText { to { opacity:1; transform:translateY(0); } }
  @keyframes ceremonyExit { to { opacity:0; transform:scale(.72) translateY(-10vh); } }
  @media (prefers-reduced-motion:reduce) {
    #rating-ceremony.playing .ceremony-cover,#rating-ceremony.playing .ceremony-seal,#rating-ceremony.playing .ceremony-tier,#rating-ceremony.leaving .ceremony-stage { animation:none; opacity:1; transform:none; }
  }

  /* ── ADD MODAL ── */
  #add-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.88); backdrop-filter:blur(10px); z-index:300; display:none; align-items:center; justify-content:center; padding:30px; }
  #add-backdrop.open { display:flex; }
  #add-modal { background:#111; border:1px solid #222; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; padding:36px; animation:modalIn .3s cubic-bezier(.34,1.4,.64,1); position:relative; }
  #add-modal h2 { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:5px; margin-bottom:26px; color:var(--text); }
  .field { margin-bottom:18px; }
  .field label { display:block; font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .field input,.field textarea,.field select { width:100%; background:#1a1a1a; border:1px solid #2a2a2a; color:var(--text); padding:10px 14px; font-family:'DM Mono',monospace; font-size:12px; outline:none; transition:border-color .2s; resize:vertical; }
  .field input:focus,.field textarea:focus,.field select:focus { border-color:#444; }
  .field textarea { min-height:90px; }
  .search-row { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .search-inputs { flex:1; display:flex; gap:10px; min-width:0; }
  .search-row input { flex:1; min-width:0; background:#1a1a1a; border:1px solid #2a2a2a; color:var(--text); padding:10px 14px; font-family:'DM Mono',monospace; font-size:12px; outline:none; transition:border-color .2s; }
  .search-row input:focus { border-color:#444; }
  #search-btn { background:#222; border:1px solid #333; color:var(--text); padding:10px 18px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1.5px; cursor:pointer; text-transform:uppercase; white-space:nowrap; transition:background .2s; }
  #search-btn:hover { background:#2e2e2e; }
  #search-btn:disabled { opacity:.4; cursor:not-allowed; }
  #search-results { max-height:260px; overflow-y:auto; border:1px solid #222; margin-bottom:18px; display:none; }
  .result-item { display:flex; gap:12px; align-items:center; padding:10px 14px; cursor:pointer; border-bottom:1px solid #1a1a1a; transition:background .15s; }
  .result-item:last-child { border-bottom:none; }
  .result-item:hover { background:#1a1a1a; }
  .result-thumb { width:46px; height:46px; object-fit:cover; flex-shrink:0; background:#222; }
  .result-info { flex:1; min-width:0; }
  .result-title { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result-sub { font-size:10px; color:var(--muted); letter-spacing:1px; margin-top:2px; }
  .result-check { font-size:14px; color:var(--bp); flex-shrink:0; }
  .result-source { font-size:8px; letter-spacing:1.5px; color:#444; flex-shrink:0; font-family:'DM Mono',monospace; }
  #search-status { font-size:10px; color:var(--muted); letter-spacing:1px; padding:10px 14px; text-align:center; }
  #selected-preview { display:none; gap:14px; align-items:center; padding:12px 14px; margin-bottom:18px; background:#161616; border:1px solid #2a2a2a; }
  #selected-preview.visible { display:flex; }
  #selected-cover-thumb { width:60px; height:60px; object-fit:cover; background:#222; flex-shrink:0; }
  #selected-info { flex:1; min-width:0; }
  #selected-title-text { font-size:12px; font-weight:500; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #selected-sub-text { font-size:10px; color:var(--muted); letter-spacing:1px; }
  #clear-selection { background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; padding:4px 8px; transition:color .2s; flex-shrink:0; }
  #clear-selection:hover { color:var(--text); }
  .form-row { display:flex; gap:14px; }
  .form-row .field { flex:1; }
  #save-btn { width:100%; background:var(--text); color:var(--bg); border:none; padding:13px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:4px; cursor:pointer; margin-top:10px; transition:opacity .2s; }
  #save-btn:hover { opacity:.85; }
  #add-close { position:absolute; top:14px; right:16px; background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; padding:4px 8px; transition:color .2s; line-height:1; }
  #add-close:hover { color:var(--text); }
  #score-tier-preview { display:inline-block; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:3px; padding:3px 10px; margin-top:6px; border:1px solid; opacity:0; transition:opacity .2s; }
  .editing-badge { display:inline-block; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--bp); border:1px solid var(--bp); padding:2px 8px; margin-left:12px; vertical-align:middle; }
  .modal-divider { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .modal-divider::before,.modal-divider::after { content:''; flex:1; height:1px; background:#222; }

  /* ── SCROLL HINT ── */
  #scroll-hint { position:fixed; bottom:28px; right:32px; z-index:50; display:flex; flex-direction:column; align-items:center; gap:6px; opacity:.35; transition:opacity .5s; pointer-events:none; }
  #scroll-hint.hidden { opacity:0; }
  .clock-ring { width:36px; height:36px; border-radius:50%; border:1px solid var(--muted); position:relative; }
  .clock-hand { position:absolute; bottom:50%; left:50%; transform-origin:bottom center; width:1px; background:var(--text); border-radius:1px; }
  .clock-hand.hour   { height:9px;  transform:translateX(-50%) rotate(0deg); animation:tick 6s linear infinite; }
  .clock-hand.minute { height:13px; transform:translateX(-50%) rotate(0deg); animation:tick 1s linear infinite; }
  @keyframes tick { to { transform:translateX(-50%) rotate(360deg); } }
  #scroll-hint span { font-size:8px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:2px; }

  /* ── HEADER NOISE TEXTURE ── */
  #header::after {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
    opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:160px;
  }
  #header-inner { position:relative; z-index:2; }

  /* ── SCROLL REVEAL ── */
  .album-card, .album-list-row {
    opacity:0; transform:translateY(18px);
    transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.2,.64,1);
  }
  .album-card.revealed, .album-list-row.revealed { opacity:1; transform:none; }

  /* ── LEFT BORDER ACCENT ON LIST ROWS ── */
  .album-list-row { border-left:3px solid transparent; transition:background .15s, border-left-color .2s; }
  .album-list-row:hover { border-left-color:var(--tier-color,#333); }
  .album-list-row.now-playing { border-left-color:#3ab870; }

  /* ── WAVEFORM IN NOW PLAYING BAR ── */
  .np-waveform { display:flex; align-items:center; gap:2px; height:20px; flex-shrink:0; }
  .np-waveform span { display:block; width:2px; border-radius:2px; background:#3ab870; animation:wave-bar 1s ease-in-out infinite; }
  .np-waveform span:nth-child(1){height:8px;animation-delay:0s}
  .np-waveform span:nth-child(2){height:14px;animation-delay:.1s}
  .np-waveform span:nth-child(3){height:18px;animation-delay:.2s}
  .np-waveform span:nth-child(4){height:12px;animation-delay:.3s}
  .np-waveform span:nth-child(5){height:16px;animation-delay:.15s}
  .np-waveform span:nth-child(6){height:10px;animation-delay:.25s}
  .np-waveform span:nth-child(7){height:6px;animation-delay:.05s}
  @keyframes wave-bar { 0%,100%{transform:scaleY(1);opacity:.7} 50%{transform:scaleY(.35);opacity:1} }

  /* ── STATUS FILTER ── */
  #status-filter {
    background:#161616; border:1px solid #2a2a2a; color:var(--text);
    padding:8px 12px; font-family:'DM Mono',monospace; font-size:11px;
    outline:none; cursor:pointer; transition:border-color .2s;
  }
  #status-filter:focus { border-color:#444; }

  /* ── LEGENDARY BORDER (track score 11) ── */
  @keyframes legendaryGlow {
    0%,100% { box-shadow: 0 0 0 3px #c9a84c, 0 0 12px 2px rgba(201,168,76,0.5); }
    50%     { box-shadow: 0 0 0 3px #ffe066, 0 0 22px 6px rgba(255,224,102,0.7); }
  }
  .album-card.legendary { overflow: visible; }
  .album-card.legendary::before {
    content: ''; position: absolute; inset: -3px; z-index: 0; border-radius: 3px;
    border: 3px solid #c9a84c;
    background: transparent;
    animation: legendaryGlow 2s ease-in-out infinite;
    box-shadow: 0 0 0 3px #c9a84c, 0 0 14px 3px rgba(201,168,76,0.55);
    pointer-events: none;
  }
  .album-card.legendary > img { position:relative; z-index:1; }
  .album-card.legendary > .album-overlay {
    position:absolute; inset:0; z-index:3;
    background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 55%);
    opacity:0; transition:opacity .3s; display:flex; align-items:flex-end; padding:10px;
  }
  .album-card.legendary:hover > .album-overlay { opacity:1; }
  .album-card.legendary > .compare-check { position:relative; z-index:3; }
  .album-list-row.legendary .album-list-thumb {
    box-shadow: 0 0 0 2px #c9a84c, 0 0 12px 3px rgba(201,168,76,0.5);
    animation: legendaryGlow 2s ease-in-out infinite;

  document.getElementById('modal-tier-badge').style.color  = tier.color;
  document.getElementById('modal-tier-badge').style.borderColor = tier.color;
  document.getElementById('modal-title').textContent   = album.title;
  document.getElementById('modal-artist').textContent  = album.artist;
  document.getElementById('modal-score').textContent   = album.score;
  document.getElementById('modal-score').style.color   = tier.color;

  const reviewOverlay = document.getElementById('modal-review-overlay');
  const reviewText = document.getElementById('modal-review-text');
  const reviewHint = document.getElementById('modal-review-hint');
  const review = (album.notes || '').trim();
  const reviewIsLong = review.length > 220;
  reviewText.textContent = review;
  reviewOverlay.hidden = !review;
  reviewOverlay.disabled = !reviewIsLong;
  reviewOverlay.classList.toggle('expandable', reviewIsLong);
  reviewOverlay.classList.remove('expanded');
  reviewOverlay.setAttribute('aria-expanded', 'false');
  reviewHint.textContent = reviewIsLong ? 'Tocar para leer completa' : '';

  // Botón discreto para releer el cover_url desde la DB compartida con Rater —
  // útil cuando la portada guardada quedó rota y ya se corrigió desde el Rater.
  const oldRefreshBtn = document.getElementById('modal-cover-refresh');
  if (oldRefreshBtn) oldRefreshBtn.remove();
  const refreshBtn = document.createElement('button');
  refreshBtn.id = 'modal-cover-refresh';
  refreshBtn.title = 'Releer portada desde la base de datos';
  refreshBtn.textContent = '🔄';
  refreshBtn.style.cssText = 'background:none;border:none;color:#666;font-size:11px;cursor:pointer;'
    + 'padding:2px 4px;opacity:0.6;float:right;';
  // Se conserva la acción para mantenimiento, pero no se expone en el detalle por ahora.
  refreshBtn.style.display = 'none';
  refreshBtn.onclick = async (e) => {
    e.stopPropagation();
    refreshBtn.disabled = true;
    refreshBtn.textContent = '⏳';
    const updated = await refetchCoverFromRaterDb(album);
    if (updated) {
      coverEl.src = album.coverUrl;
      refreshBtn.textContent = '✓';
    } else {
      refreshBtn.textContent = '·';
    }
    setTimeout(() => {
      refreshBtn.disabled = false;
      refreshBtn.textContent = '🔄';
      refreshBtn.style.opacity = '0.6';
    }, 1500);
  };
  document.getElementById('modal-tier-badge').after(refreshBtn);

  // meta row
  const metaParts = [];
  if (album.year)        metaParts.push(`<span class="meta-tag">📅 ${album.year}</span>`);
  if (album.listenDate)  metaParts.push(`<span class="meta-tag">🎧 First listen: ${fmtDate(album.listenDate)}</span>`);
  if ((album.genres||[]).length) metaParts.push(`<span class="meta-tag">🏷 ${album.genres.join(', ')}</span>`);
  document.getElementById('modal-meta').innerHTML = metaParts.join('');

  // status pills + now playing btn
  const statusRow = document.getElementById('modal-status-row');
  statusRow.innerHTML = '';
  ['listened','in-progress','pending'].forEach(s => {
    const pill = document.createElement('button');
    pill.className = `status-pill ${s}${album.status===s?' active':''}`;
    pill.textContent = statusLabel(s);
    if (!readOnly) {
      pill.addEventListener('click', () => {
        album.status = s;
        saveAlbums();
        openDetail(album); // refresh
        buildTiers();
      });
    }
    statusRow.appendChild(pill);
  });
  const npBtn = document.createElement('button');
  npBtn.id = 'btn-now-playing';
  npBtn.textContent = nowPlayingId === album.id ? '▶ Playing' : '▶ Now playing';
  npBtn.className = nowPlayingId === album.id ? 'active' : '';
  npBtn.addEventListener('click', () => {
    nowPlayingId = nowPlayingId === album.id ? null : album.id;
    saveAlbums(); updateNowPlayingBar(); buildTiers();
    openDetail(album);
  });
  if (!readOnly) statusRow.appendChild(npBtn);

  // external links
  const linksDiv = document.getElementById('modal-links');
  linksDiv.innerHTML = `
    <a class="ext-link" href="${buildSearchUrl(album.title,album.artist,'spotify')}" target="_blank" rel="noopener">▶ Spotify</a>
    <a class="ext-link" href="${buildSearchUrl(album.title,album.artist,'apple')}"   target="_blank" rel="noopener">♫ Apple Music</a>
    <a class="ext-link" href="${buildSearchUrl(album.title,album.artist,'rym')}"    target="_blank" rel="noopener">★ RateYourMusic</a>`;

  // replay history
  const replayList = document.getElementById('modal-replay-list');
  replayList.innerHTML = '';
  const replays = album.replays || [];

  function renderReplayList() {
    replayList.innerHTML = '';
    const currentReplays = currentDetailAlbum.replays || [];

    if (currentDetailAlbum.listenDate) {
      const row = document.createElement('div');
      row.className = 'replay-row';
      row.innerHTML = `
        <span>First listen</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span class="replay-date">${fmtDate(currentDetailAlbum.listenDate)}</span>
          <span class="replay-actions">
            <button class="replay-edit-btn" title="Edit date">✎</button>
            <button class="replay-del-btn" title="Remove">✕</button>
          </span>
        </span>`;
      row.querySelector('.replay-edit-btn').addEventListener('click', () => {
        const dateSpan = row.querySelector('.replay-date');
        const current = currentDetailAlbum.listenDate;
        const input = document.createElement('input');
        input.type = 'date'; input.value = current;
        input.className = '';
        input.style.cssText = 'background:#1a1a1a;border:1px solid #3ab870;color:var(--text);padding:2px 6px;font-family:DM Mono,monospace;font-size:10px;outline:none;';
        dateSpan.replaceWith(input);
        input.focus();
        const save = () => {
          if (input.value) { currentDetailAlbum.listenDate = input.value; saveAlbums(); }
          renderReplayList();
        };
        input.addEventListener('blur', save);
        input.addEventListener('keydown', e => { if (e.key==='Enter') save(); });
      });
      row.querySelector('.replay-del-btn').addEventListener('click', () => {
        if (!confirm('Remove first listen date?')) return;
        currentDetailAlbum.listenDate = '';
        saveAlbums(); renderReplayList();
      });
      replayList.appendChild(row);
    }

    currentReplays.forEach((d, i) => {
      const label = `Listen #${(currentDetailAlbum.listenDate?2:1)+i}`;
      const row = document.createElement('div');
      row.className = 'replay-row';
      row.innerHTML = `
        <span>${label}</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span class="replay-date">${fmtDate(d)}</span>
          <span class="replay-actions">
            <button class="replay-edit-btn" title="Edit date">✎</button>
            <button class="replay-del-btn" title="Remove">✕</button>
          </span>
        </span>`;
      row.querySelector('.replay-edit-btn').addEventListener('click', () => {
        const dateSpan = row.querySelector('.replay-date');
        const input = document.createElement('input');
        input.type = 'date'; input.value = d;
        input.style.cssText = 'background:#1a1a1a;border:1px solid #3ab870;color:var(--text);padding:2px 6px;font-family:DM Mono,monospace;font-size:10px;outline:none;';
        dateSpan.replaceWith(input);
        input.focus();
        const save = () => {
          if (input.value) { currentDetailAlbum.replays[i] = input.value; saveAlbums(); }
          renderReplayList();
        };
        input.addEventListener('blur', save);
        input.addEventListener('keydown', e => { if (e.key==='Enter') save(); });
      });
      row.querySelector('.replay-del-btn').addEventListener('click', () => {
        if (!confirm(`Remove listen #${(currentDetailAlbum.listenDate?2:1)+i}?`)) return;
        currentDetailAlbum.replays.splice(i, 1);
        saveAlbums(); renderReplayList();
      });
      replayList.appendChild(row);
    });

    if (!currentDetailAlbum.listenDate && !currentReplays.length) {
      replayList.innerHTML = '<div style="font-size:10px;color:var(--muted)">No listens logged yet</div>';
    }
  }

  renderReplayList();

  // tracklist with inline fav + legendary toggle
  const tracksDiv = document.getElementById('modal-tracks');
  tracksDiv.innerHTML = '';
  if (album.tracks && album.tracks.length > 0) {
    album.tracks.forEach((track, i) => {
      const isLegendary = track.startsWith('!!');
      const isFav = !isLegendary && track.startsWith('*');
      const name = isLegendary ? track.slice(2).trim() : (isFav ? track.slice(1).trim() : track.trim());
      const item = document.createElement('div');
      item.className = 'track-item';
      if (isLegendary) item.style.cssText = 'background:rgba(255,140,0,0.05);border-left:2px solid #ff8c00;padding-left:6px;';
      const trackScore = album.trackScores ? album.trackScores[name] : null;
      const scoreHtml = (!isNaN(trackScore) && trackScore !== null)
        ? `<span style="font-family:'DM Mono',monospace;font-size:11px;color:${trackScore >= 9.5 ? '#c8f060' : trackScore >= 8.5 ? '#60d0f0' : trackScore >= 7 ? '#f0a030' : 'var(--muted)'};margin-left:auto;padding-right:4px;flex-shrink:0;">${parseFloat(trackScore).toFixed(1)}</span>`
        : '';
      item.innerHTML = `
        <span class="track-num">${String(i+1).padStart(2,'0')}</span>
        <span class="track-name" style="${isLegendary ? 'color:#ffd700;font-weight:600' : ''}">${isLegendary ? '⚡ ' : ''}${escHtml(name)}</span>
        ${scoreHtml}
        <button class="track-legendary-btn" title="${isLegendary ? 'Quitar 11' : 'Marcar como 11 legendario'}" style="background:none;border:none;cursor:pointer;font-size:12px;padding:2px 6px;opacity:${isLegendary ? '1' : '0.2'};transition:opacity .2s">⚡</button>
        <button class="track-fav-btn${isFav ? ' is-fav' : ''}" title="${isFav ? 'Remove fav' : 'Mark as fav'}">★</button>`;
      item.querySelector('.track-legendary-btn').addEventListener('click', e => {
        e.stopPropagation();
        const cur = album.tracks[i];
        const wasL = cur.startsWith('!!');
        const wasF = !wasL && cur.startsWith('*');
        const clean = wasL ? cur.slice(2).trim() : (wasF ? cur.slice(1).trim() : cur.trim());
        album.tracks[i] = wasL ? clean : '!!' + clean;
        saveAlbums();
        buildTiers();
        openDetail(album);
      });
      item.querySelector('.track-fav-btn').addEventListener('click', e => {
        e.stopPropagation();
        const cur = album.tracks[i];
        if (cur.startsWith('!!')) return;
        const wasFav = cur.startsWith('*');
        album.tracks[i] = wasFav ? cur.slice(1).trimStart() : '*' + cur.trim();
        saveAlbums();
        e.currentTarget.classList.toggle('is-fav', !wasFav);
      });
      tracksDiv.appendChild(item);
    });
  } else {
    tracksDiv.innerHTML = '<div style="color:var(--muted);font-size:11px">No tracklist added</div>';
  }

  const backdrop = document.getElementById('modal-backdrop');
  const modalEl  = document.getElementById('modal');

  // Compute transform-origin from the clicked element's position
  if (originEl) {
    const r = originEl.getBoundingClientRect();
    const ox = ((r.left + r.width  / 2) / window.innerWidth  * 100).toFixed(1) + '%';
    const oy = ((r.top  + r.height / 2) / window.innerHeight * 100).toFixed(1) + '%';
    modalEl.style.setProperty('--modal-origin-x', ox);
    modalEl.style.setProperty('--modal-origin-y', oy);
  } else {
    modalEl.style.setProperty('--modal-origin-x', '50%');
    modalEl.style.setProperty('--modal-origin-y', '50%');
  }

  modalEl.classList.remove('modal-ready');
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';

  requestAnimationFrame(() => {
    backdrop.classList.add('animated');
    requestAnimationFrame(() => {
      modalEl.classList.add('modal-ready');
    });
  });
}

// ── CUSTOM TIER DROPDOWN ──
(function buildTierDropdown() {
  const list = document.getElementById('tier-dropdown-list');
  const btn  = document.getElementById('tier-dropdown-btn');
  list.innerHTML = '';
  TIERS.forEach(t => {
    const opt = document.createElement('div');
    opt.className = 'tier-opt';
    opt.dataset.tierId = t.id;
    opt.innerHTML = `
      <span class="tier-opt-swatch" style="background:${t.color}"></span>
      <span class="tier-opt-label" style="color:${t.color}">${t.label}</span>
      <span class="tier-opt-range">${t.range}</span>
      <span class="tier-opt-check">✓</span>`;
    opt.addEventListener('click', () => {
      selectedTierId = t.id;
      // update button face
      btn.querySelector('.tdb-swatch').style.background = t.color;
      btn.querySelector('.tdb-label').textContent = `${t.label}  —  ${t.range}`;
      btn.querySelector('.tdb-label').style.color = t.color;
      btn.classList.add('has-value');
      // mark selected
      list.querySelectorAll('.tier-opt').forEach(o => o.classList.toggle('selected', o.dataset.tierId === t.id));
      // update preview
      const preview = document.getElementById('score-tier-preview');
      preview.textContent = '→ ' + t.label;
      preview.style.color = t.color;
      preview.style.borderColor = t.color;
      preview.style.opacity = '1';
      // close
      list.classList.remove('open');
      btn.classList.remove('open');
    });
    list.appendChild(opt);
  });

  // toggle open/close
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = list.classList.toggle('open');
    btn.classList.toggle('open', isOpen);

const searchAlbumInput  = document.getElementById('search-album');
const searchArtistInput = document.getElementById('search-artist');
const searchBtn         = document.getElementById('search-btn');
const searchResultsEl   = document.getElementById('search-results');

searchAlbumInput.addEventListener('keydown',  e => { if (e.key==='Enter') doSearch(); });
searchArtistInput.addEventListener('keydown', e => { if (e.key==='Enter') doSearch(); });
searchBtn.addEventListener('click', doSearch);

async function doSearch() {
  const album  = searchAlbumInput.value.trim();
  const artist = searchArtistInput.value.trim();
  if (!album && !artist) return;

  const engine = document.getElementById('search-engine-select').value;

  searchBtn.disabled = true; searchBtn.textContent = '⏳';
  searchResultsEl.style.display = 'block';

  function renderLfm(results) {
    searchResultsEl.innerHTML = '';
    for (const r of results.slice(0, 10)) {
      if (!r.name || r.name === '(null)') continue;
      const coverUrl = pickLfmImage(r.image);
      const item = document.createElement('div');
      item.className = 'result-item';
      item.innerHTML = `
        <img class="result-thumb" src="${escHtml(coverUrl)}" alt=""
             onerror="this.style.background='#1a1a1a';this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%231a1a1a%22 width=%221%22 height=%221%22/></svg>'">
        <div class="result-info">
          <div class="result-title">${escHtml(r.name)}</div>
          <div class="result-sub">${escHtml(r.artist)}</div>
        </div>
        <span class="result-source" style="font-size:8px;letter-spacing:1px;color:#555;flex-shrink:0">LFM</span>
        <span class="result-check" style="display:none">✓</span>`;
      item.addEventListener('click', () => selectLfmRelease(r.name, r.artist, coverUrl, item));
      searchResultsEl.appendChild(item);
    }
    if (!searchResultsEl.querySelector('.result-item'))
      searchResultsEl.innerHTML = '<div id="search-status">No results found.</div>';
  }

  function renderMb(releases) {
    searchResultsEl.innerHTML = '';
    for (const r of releases.slice(0, 8)) {
      const art  = r['artist-credit']?.[0]?.name || r['artist-credit']?.[0]?.artist?.name || '';
      const year = (r.date||'').slice(0,4);
      const mbid = r.id;
      const thumbUrl = `${CAA_BASE}/release/${mbid}/front-250`;
      const item = document.createElement('div');
      item.className = 'result-item';
      item.innerHTML = `
        <img class="result-thumb" src="${thumbUrl}" alt=""
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%231a1a1a%22 width=%221%22 height=%221%22/></svg>'">
        <div class="result-info">
          <div class="result-title">${escHtml(r.title)}</div>
          <div class="result-sub">${escHtml(art)}${year?' · '+year:''}${r.country?' · '+r.country:''}</div>
        </div>
        <span class="result-source" style="font-size:8px;letter-spacing:1px;color:#555;flex-shrink:0">MB</span>
        <span class="result-check" style="display:none">✓</span>`;
      item.addEventListener('click', () => selectRelease(mbid, r.title, art, year, thumbUrl, item));
      searchResultsEl.appendChild(item);
    }
  }

  try {
    if (engine === 'lastfm') {
      searchResultsEl.innerHTML = '<div id="search-status">Searching Last.fm…</div>';
      const results = await searchLastFm(album, artist);
      if (!results.length) { searchResultsEl.innerHTML = '<div id="search-status">No results found on Last.fm.</div>'; return; }
      renderLfm(results); return;
    }
    if (engine === 'musicbrainz') {
      searchResultsEl.innerHTML = '<div id="search-status">Searching MusicBrainz…</div>';
      const q2 = album && artist ? `release:${album} AND artist:${artist}` : (album || artist);
      const releases2 = await searchMusicBrainz(q2);
      if (!releases2.length) { searchResultsEl.innerHTML = '<div id="search-status">No results found on MusicBrainz.</div>'; return; }
      renderMb(releases2); return;
    }

    // ── AUTO: Last.fm primero, MusicBrainz de fallback ──
    searchResultsEl.innerHTML = '<div id="search-status">Searching Last.fm…</div>';
    const lfmResults = await searchLastFm(album, artist);
    if (lfmResults.length) { renderLfm(lfmResults); return; }

    searchResultsEl.innerHTML = '<div id="search-status">Trying MusicBrainz…</div>';
    const q = album && artist ? `release:${album} AND artist:${artist}` : (album || artist);
    const releases = await searchMusicBrainz(q);
    if (!releases.length) { searchResultsEl.innerHTML = '<div id="search-status">No results found.</div>'; return; }
    renderMb(releases);

  } catch(e) {
    searchResultsEl.innerHTML = `<div id="search-status">Error: ${e.message}</div>`;
  } finally {
    searchBtn.disabled = false; searchBtn.textContent = '🔍';
  }
}

// ── SELECT from Last.fm result ──
async function selectLfmRelease(title, artist, coverUrl, itemEl) {
  searchResultsEl.querySelectorAll('.result-item').forEach(el => {
    el.querySelector('.result-check').style.display = 'none'; el.style.background = '';
  });
  itemEl.querySelector('.result-check').style.display = 'inline';
  itemEl.style.background = '#1e1e1e';

  document.getElementById('input-title').value  = title;
  document.getElementById('input-artist').value = artist;
  document.getElementById('input-year').value   = '';

  const preview = document.getElementById('selected-preview');
  document.getElementById('selected-cover-thumb').src = coverUrl || '';
  document.getElementById('selected-title-text').textContent = title;
  document.getElementById('selected-sub-text').textContent   = artist;
  preview.classList.add('visible');

  const trackField = document.getElementById('input-tracks');
  const genreField = document.getElementById('input-genres');
  trackField.value = 'Loading…'; trackField.disabled = true;
  genreField.value = 'Loading…'; genreField.disabled = true;

  // Get full album info from Last.fm (tags + tracklist + year)
  const info = await getLastFmAlbumInfo(artist, title);

  let tracks = [];
  let genres = [];
  let year   = '';

  if (info) {
    // Tracks
    const lfmTracks = info.tracks?.track;
    if (Array.isArray(lfmTracks))       tracks = lfmTracks.map(t => t.name).filter(Boolean);
    else if (lfmTracks?.name)           tracks = [lfmTracks.name];

    // Tags/genres
    const lfmTags = info.tags?.tag;
    const tagList = Array.isArray(lfmTags) ? lfmTags : (lfmTags ? [lfmTags] : []);
    genres = cleanGenres(tagList.slice(0, 4).map(t => t.name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')));

    // Wiki published year
    const wiki = info.wiki?.published;
    if (wiki) {
      const m = wiki.match(/\b(19|20)\d{2}\b/);
      if (m) year = m[0];
    }

    // Better cover from info if available
    const bigCover = pickLfmImage(info.image);
    if (bigCover) coverUrl = bigCover;
  }

  // Last.fm conserva una buena coincidencia de edición, pero sus archivos pueden ser
  // chicos. Si iTunes encuentra el mismo álbum/artista, preferimos su arte grande.
  const itunesCover = await getHighResItunesCover(title, artist);
  if (itunesCover) coverUrl = itunesCover;

  if (year) document.getElementById('input-year').value = year;
  document.getElementById('selected-sub-text').textContent = `${artist}${year ? ' · ' + year : ''}`;
  if (coverUrl) document.getElementById('selected-cover-thumb').src = coverUrl;

  trackField.disabled = false; trackField.value = tracks.join('\n');
  genreField.disabled = false;
  if (genres.length) {
    genreField.value = genres.join(', ');
    genreField.style.borderColor = '#3ab870';
    setTimeout(() => { genreField.style.borderColor = ''; }, 1200);
  } else {
    genreField.value = '';
  }

  selectedRelease = { title, artist, year, coverUrl, tracks, genres, mbid: null };
}

async function selectRelease(mbid, title, artist, year, thumbUrl, itemEl) {
  searchResultsEl.querySelectorAll('.result-item').forEach(el => {
    el.querySelector('.result-check').style.display = 'none'; el.style.background = '';
  });
  itemEl.querySelector('.result-check').style.display = 'inline';
  itemEl.style.background = '#1e1e1e';

  document.getElementById('input-title').value  = title;
  document.getElementById('input-artist').value = artist;
  document.getElementById('input-year').value   = year;

  const preview = document.getElementById('selected-preview');
  document.getElementById('selected-cover-thumb').src = thumbUrl;
  document.getElementById('selected-title-text').textContent = title;
  document.getElementById('selected-sub-text').textContent   = `${artist}${year?' · '+year:''}`;
  preview.classList.add('visible');

  const trackField = document.getElementById('input-tracks');
  const genreField = document.getElementById('input-genres');
  trackField.value = 'Loading tracklist…'; trackField.disabled = true;
  genreField.value = 'Loading genres…';   genreField.disabled = true;

  const [tracks, genres] = await Promise.all([getTracklist(mbid), getGenres(mbid)]);

  trackField.disabled = false; trackField.value = tracks.join('\n');
  genreField.disabled = false;
  if (genres.length) {
    genreField.value = genres.join(', ');

    genreField.style.borderColor = '#3ab870';
    setTimeout(() => { genreField.style.borderColor = ''; }, 1200);
  } else {
    genreField.value = '';
  }

  selectedRelease = { title, artist, year, coverUrl: thumbUrl, tracks, genres, mbid };
}

function playRatingCeremony(album) {
  const tier = getTier(album.score);
  if (!tier) return;
  const ceremony = document.getElementById('rating-ceremony');
  const cover = document.getElementById('ceremony-cover');
  ceremony.style.setProperty('--ceremony-tier', tier.color);

  cover.alt = album.title || '';

  document.getElementById('ceremony-score').textContent = Number(album.score).toFixed(2);
  document.getElementById('ceremony-tier').textContent = `${tier.label} · ${Number(album.score).toFixed(2)}`;

  if (ratingCeremonyTimer) clearTimeout(ratingCeremonyTimer);

  ratingCeremonyTimer = setTimeout(() => ceremony.classList.add('leaving'), 2100);

    target?.scrollIntoView({ behavior:'smooth', block:'start' });
    // Rating has priority; only then may the lightweight achievement inbox speak.
    refreshAchievements();
  }, 2740);
}

document.getElementById('save-btn').addEventListener('click', () => {

  const status     = document.getElementById('input-status').value;
  const isPending  = status === 'pending';

  let score;
  if (isPending) {
    score = 0; // pending albums have no score
  } else if (scoreModeIsTier) {
    if (!selectedTierId) { alert('Selecciona un tier.'); return; }
    const tier = TIERS.find(t => t.id === selectedTierId);
    score = tier ? (tier.min === tier.max ? tier.min : parseFloat(((tier.min + tier.max) / 2).toFixed(2))) : NaN;
  } else {
    score = parseFloat(document.getElementById('input-score').value);
  }

  const tracksRaw  = document.getElementById('input-tracks').value;
  const notes      = document.getElementById('input-notes').value.trim();
  const genresRaw  = document.getElementById('input-genres').value.trim();
  const listenDate = isPending ? '' : document.getElementById('input-listen-date').value;

  if (!title || !artist || (!isPending && isNaN(score))) { alert('Completa el título, artista y puntaje.'); return; }

  const tracks = tracksRaw.split('\n').map(t => t.trim()).filter(Boolean);
  const genres = genresRaw ? cleanGenres(genresRaw.split(',')) : [];

  let newlySavedAlbum = null;
  let achievementEvents = [];
  if (editingAlbumId) {
    const idx = albums.findIndex(a => a.id === editingAlbumId);
    if (idx !== -1) {
      const before = albums[idx];
      albums[idx] = { ...before, title, artist, year, score, tracks, notes, genres, listenDate, status,
        coverUrl: selectedRelease?.coverUrl || albums[idx].coverUrl,
        musicbrainzReleaseMbid: selectedRelease?.mbid || before.musicbrainzReleaseMbid || null };
      const oldScore = Number(before.score), nextScore = Number(score);
      if (status === 'listened' && before.status === 'listened' && Number.isFinite(oldScore) && Number.isFinite(nextScore) && Math.abs(nextScore-oldScore) >= .01) {
        const occurredAt = new Date().toISOString();
        const history = Array.isArray(before.scoreHistory) ? [...before.scoreHistory] : [{ score:oldScore, date:before.listenDate || occurredAt.slice(0,10), label:'Initial score' }];
        const previous = history[history.length-1]; history.push({score:Number(nextScore.toFixed(2)),date:occurredAt.slice(0,10),timestamp:occurredAt,label:'Re-score'}); albums[idx].scoreHistory=history;
        achievementEvents.push(makeAchievementEvent('album_rescored',albums[idx],{previous_score:Number(oldScore.toFixed(2)),new_score:Number(nextScore.toFixed(2)),delta:Number((nextScore-oldScore).toFixed(2)),previous_at:previous?.timestamp || (previous?.date ? new Date(previous.date+'T00:00:00Z').toISOString() : null)}));
      }
      if (notes !== (before.notes || '')) achievementEvents.push(makeAchievementEvent('review_updated', albums[idx], { review_text: notes }));
      if (Object.keys(albums[idx].trackScores||{}).length) achievementEvents.push(makeAchievementEvent('track_scores_saved', albums[idx]));
    }
  } else {
    newlySavedAlbum = { id:'alb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      title, artist, year, score, tracks, notes, genres, listenDate, status,
      coverUrl: selectedRelease?.coverUrl || '',
      musicbrainzReleaseMbid: selectedRelease?.mbid || null,
      addedAt: Date.now(), replays:[], scoreHistory: isPending ? [] : [{score:Number(Number(score).toFixed(2)),date:new Date().toISOString().slice(0,10),label:'Initial score'}] };
    albums.push(newlySavedAlbum);
    if (!isPending) { achievementEvents.push(makeAchievementEvent('album_added',newlySavedAlbum)); achievementEvents.push(makeAchievementEvent('album_rated',newlySavedAlbum,{score:Number(Number(score).toFixed(2))})); }
    if (notes) achievementEvents.push(makeAchievementEvent('review_written',newlySavedAlbum,{review_text:notes}));
  }

  if (achievementEvents.length) saveAlbumsWithAchievementEvents(achievementEvents); else saveAlbums();

  ['input-title','input-artist','input-year','input-score','input-tracks','input-notes','input-genres','input-listen-date']
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('input-status').value = 'listened';
  // reset custom tier dropdown
  selectedTierId = null;
  const tdb = document.getElementById('tier-dropdown-btn');
  tdb.querySelector('.tdb-label').textContent = '— Selecciona tier —';
  tdb.querySelector('.tdb-label').style.color = '';
  tdb.querySelector('.tdb-swatch').style.background = '';
  tdb.classList.remove('has-value');
  document.getElementById('tier-dropdown-list').querySelectorAll('.tier-opt').forEach(o => o.classList.remove('selected'));
  document.getElementById('score-tier-preview').style.opacity = '0';
  document.getElementById('selected-preview').classList.remove('visible');
  searchAlbumInput.value = ''; searchArtistInput.value = '';
  searchResultsEl.style.display = 'none'; searchResultsEl.innerHTML = '';
  selectedRelease = null;

  const savedScore = score;
  const savedIsPending = isPending;
  closeAddModal();
  refreshGenreFilter();
  buildTiersWithReveal();
  if (newlySavedAlbum && !savedIsPending) {
    setTimeout(() => playRatingCeremony(newlySavedAlbum), 120);
  } else if (!savedIsPending) {
    setTimeout(() => {
      document.getElementById('tier-'+getTier(savedScore).id)?.scrollIntoView({ behavior:'smooth' });
    }, 200);
  }
});

// ── GENRE CLEANER (filtra tags basura de MusicBrainz) ──
function cleanGenres(genres) {
  if (!Array.isArray(genres)) return [];
  const junkPatterns = [
    /wochen/i, /chart/i, /cover/i, /collection/i, /offizielle/i,
    /physical/i, /digital/i, /loonaids/i, /mofad/i, /aoth\b/i,
    /^\d{4}$/, // pure year like "2024"
    /^ep$/i, /^lp$/i, /^y$/i, /^aoty$/i,
  ];
  const unique = new Set();
  return genres.reduce((clean, g) => {
    if (!g || typeof g !== 'string') return clean;
    const trimmed = g.trim();
    if (!trimmed || junkPatterns.some(p => p.test(trimmed))) return clean;
    const normalized = normalizeGenreName(trimmed);
    const key = normalized.toLocaleLowerCase();
    if (!unique.has(key)) { unique.add(key); clean.push(normalized); }
    return clean;
  }, []);
}

// Un solo nombre canónico para el mismo género. Se deja el resto de géneros tal
// como los escribió el usuario o la fuente, pero K-pop no se fragmenta en
// "Kpop", "k pop", "K-POP", etc.
function normalizeGenreName(value) {
  const label = String(value || '').trim();
  const key = label
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLocaleLowerCase()
    .replace(/[\s_.-]+/g, '');
  return key === 'kpop' || key === 'kpopmusic' ? 'K-pop' : label;
}

function normalizeAlbumGenres(album) {
  if (!album || typeof album !== 'object') return false;
  const before = Array.isArray(album.genres) ? album.genres : [];
  const after = cleanGenres(before);
  const changed = before.length !== after.length || before.some((genre, index) => genre !== after[index]);
  if (changed) album.genres = after;
  return changed;
}

function normalizeCollectionGenres(collection) {
  let changed = false;
  (collection || []).forEach(album => { if (normalizeAlbumGenres(album)) changed = true; });
  return changed;
}

      if (!confirm(`Import ${data.albums.length} albums? This will replace your current data.`)) return;

      saveAlbums();
      buildTiersWithReveal();
      updateNowPlayingBar();
      refreshGenreFilter();
      alert('Import successful!');
    } catch(err) {
      alert('Error importing: ' + err.message);

    e.target.value = '';
  };
  reader.readAsText(file);
});

async function exportVaultImage() {
  // ── Layout constants ──
  const SCALE      = 3;          // retina multiplier
  const THUMB      = 80;         // album cover px (logical)
  const GAP        = 8;
  const ROW_PAD_X  = 24;
  const ROW_PAD_Y  = 14;
  const LABEL_W    = 90;
  const COLS_MAX   = 12;         // max covers per row before wrapping
  const HEADER_H   = 48;
  const FONT_MONO  = "'DM Mono', 'Courier New', monospace";
  const FONT_BEBAS = "'Bebas Neue', Impact, sans-serif";
  const BG         = '#0a0a0a';
  const BORDER     = '#1e1e1e';
  const MUTED      = '#555555';

  // Collect tiers that have albums
  const visible = getVisibleAlbums();
  const tierRows = TIERS.map(t => ({
    tier: t,
    albums: visible.filter(a => getTier(a.score)?.id === t.id)
  })).filter(r => r.albums.length > 0);

  // Preload all cover images
  const loadImg = (url) => new Promise(resolve => {
    if (!url) { resolve(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });

  const allCovers = await Promise.all(
    tierRows.flatMap(r => r.albums.map(a => loadImg(a.coverUrl)))
  );
  // Map cover images back to albums
  let coverIdx = 0;
  tierRows.forEach(r => {
    r.coverImgs = r.albums.map(() => allCovers[coverIdx++]);
  });

  // ── Compute canvas width ──
  // Try to fit nicely: aim for ~1400px logical width
  const TOTAL_W = 1400;
  const albumsW = TOTAL_W - LABEL_W - ROW_PAD_X * 2;
  const COLS = Math.min(COLS_MAX, Math.floor((albumsW + GAP) / (THUMB + GAP)));

  // ── Compute each row height ──
  tierRows.forEach(r => {
    const rows = Math.ceil(r.albums.length / COLS);
    r.rowH = rows * (THUMB + GAP) - GAP + ROW_PAD_Y * 2;
    r.rowH = Math.max(r.rowH, THUMB + ROW_PAD_Y * 2);
  });

  const totalH = HEADER_H + tierRows.reduce((s, r) => s + r.rowH + 1, 0); // +1 border

  // ── Create canvas ──
  const canvas  = document.createElement('canvas');
  canvas.width  = TOTAL_W  * SCALE;
  canvas.height = totalH   * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, TOTAL_W, totalH);

  // ── Header ──
  ctx.fillStyle = '#111111';
  ctx.fillRect(0, 0, TOTAL_W, HEADER_H);
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HEADER_H); ctx.lineTo(TOTAL_W, HEADER_H); ctx.stroke();

  ctx.fillStyle = '#e8e4dc';
  ctx.font = `${HEADER_H * 0.55}px ${FONT_BEBAS}`;
  ctx.letterSpacing = '8px';
  ctx.textBaseline = 'middle';
  ctx.fillText('ALBUM VAULT', ROW_PAD_X, HEADER_H / 2);

  ctx.fillStyle = MUTED;
  ctx.font = `10px ${FONT_MONO}`;
  ctx.letterSpacing = '2px';
  ctx.textAlign = 'right';
  ctx.fillText(`${albums.length} ALBUMS  ·  ${new Date().toISOString().slice(0,10)}`, TOTAL_W - ROW_PAD_X, HEADER_H / 2);
  ctx.textAlign = 'left';

  // ── Tier rows ──
  let y = HEADER_H;

  for (const r of tierRows) {
    const { tier, albums: rowAlbums, coverImgs, rowH } = r;

    // Row bg
    ctx.fillStyle = BG;
    ctx.fillRect(0, y, TOTAL_W, rowH);

    // Subtle tier color tint across full row
    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = tier.color;
    ctx.fillRect(0, y, TOTAL_W, rowH);
    ctx.restore();

    // Colored top border line (tier separator)
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = tier.color;
    ctx.fillRect(0, y, TOTAL_W, 2);
    ctx.restore();

    // Left label area
    ctx.fillStyle = '#111111';
    ctx.fillRect(0, y, LABEL_W, rowH);

    // Subtle tier color tint on label
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = tier.color;
    ctx.fillRect(0, y, LABEL_W, rowH);
    ctx.restore();

    // Tier letter
    const fontSize = Math.min(52, rowH * 0.55);
    ctx.font      = `${fontSize}px ${FONT_BEBAS}`;
    ctx.fillStyle = tier.color;
    ctx.letterSpacing = '0px';
    ctx.textBaseline  = 'middle';
    ctx.textAlign     = 'center';
    ctx.fillText(tier.label, LABEL_W / 2, y + rowH / 2 - 6);

    // Album count below label
    ctx.font      = `9px ${FONT_MONO}`;
    ctx.fillStyle = MUTED;
    ctx.letterSpacing = '1px';
    ctx.fillText(rowAlbums.length + (rowAlbums.length === 1 ? ' album' : ' albums'), LABEL_W / 2, y + rowH / 2 + fontSize / 2 - 2);

    ctx.textAlign = 'left';

    // Separator line between label and albums
    ctx.strokeStyle = BORDER;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(LABEL_W, y); ctx.lineTo(LABEL_W, y + rowH); ctx.stroke();

    // Draw covers
    let ax = LABEL_W + ROW_PAD_X;
    let ay = y + ROW_PAD_Y;
    rowAlbums.forEach((album, i) => {
      const col = i % COLS;
      const row = Math.floor(i / COLS);
      const cx  = ax + col * (THUMB + GAP);
      const cy  = ay + row * (THUMB + GAP);

      const img = coverImgs[i];
      if (img) {
        ctx.drawImage(img, cx, cy, THUMB, THUMB);
      } else {
        // placeholder
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(cx, cy, THUMB, THUMB);
        ctx.fillStyle = MUTED;
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♪', cx + THUMB / 2, cy + THUMB / 2);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }

      // Score badge bottom-right
      const scoreStr = String(album.score);
      ctx.font = `bold 9px ${FONT_MONO}`;
      const badgeH = 14, badgePad = 5;
      const scoreW = ctx.measureText(scoreStr).width + badgePad * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(cx + THUMB - scoreW, cy + THUMB - badgeH, scoreW, badgeH);
      ctx.fillStyle = tier.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(scoreStr, cx + THUMB - scoreW / 2, cy + THUMB - badgeH / 2);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      // Legendary gold border
      if (hasLegendaryTrack(album)) {
        ctx.save();
        ctx.strokeStyle = '#c9a84c';
        ctx.lineWidth = 3;
        ctx.shadowColor = 'rgba(201,168,76,0.7)';
        ctx.shadowBlur = 8;
        ctx.strokeRect(cx - 2, cy - 2, THUMB + 4, THUMB + 4);
        ctx.restore();
      }

      // Thin border overlay
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx + 0.5, cy + 0.5, THUMB - 1, THUMB - 1);
    });

    // Row bottom border
    ctx.strokeStyle = BORDER;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y + rowH); ctx.lineTo(TOTAL_W, y + rowH); ctx.stroke();

    y += rowH + 1;
  }

  // Download
  const link = document.createElement('a');
  link.download = 'album-vault-' + new Date().toISOString().slice(0,10) + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function renderStats() {
  if (!albums.length) {
    document.getElementById('stats-numbers').innerHTML = '<p style="color:var(--muted);font-size:11px">No albums yet.</p>';
    return;
  }
  const total   = albums.length;
  const avgScore = (albums.reduce((s,a) => s+a.score, 0) / total).toFixed(2);
  const topTier  = TIERS.find(t => albums.some(a => getTier(a.score)?.id === t.id));
  const allListens = albums.reduce((s,a) => s + (a.replays||[]).length + (a.listenDate?1:0), 0);

  // artist counts
  const artistMap = {};
  albums.forEach(a => { artistMap[a.artist] = (artistMap[a.artist]||0)+1; });
  const topArtist = Object.entries(artistMap).sort((a,b)=>b[1]-a[1])[0];

  const mostListened = [...albums].sort((a,b) =>
    ((b.replays||[]).length+(b.listenDate?1:0)) - ((a.replays||[]).length+(a.listenDate?1:0))
  )[0];

  document.getElementById('stats-numbers').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total albums</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Avg score</div><div class="stat-value" style="color:${getTier(parseFloat(avgScore)).color}">${avgScore}</div></div>
    <div class="stat-card"><div class="stat-label">Total listens</div><div class="stat-value">${allListens}</div></div>
    <div class="stat-card"><div class="stat-label">Top artist</div><div class="stat-value" style="font-size:20px;line-height:1.2">${topArtist?topArtist[0]:'—'}</div><div class="stat-sub">${topArtist?topArtist[1]+' album'+(topArtist[1]>1?'s':''):''}</div></div>
    <div class="stat-card"><div class="stat-label">Most played</div><div class="stat-value" style="font-size:16px;line-height:1.3">${mostListened?.title||'—'}</div><div class="stat-sub">${mostListened?(mostListened.replays||[]).length+(mostListened.listenDate?1:0)+' listen(s)':''}</div></div>
    <div class="stat-card"><div class="stat-label">Highest tier</div><div class="stat-value" style="color:${topTier?.color||'var(--muted)'}">${topTier?.label||'—'}</div></div>`;

  // tier bars
  const maxTierCount = Math.max(...TIERS.map(t => albums.filter(a => getTier(a.score)?.id===t.id).length), 1);
  document.getElementById('stats-tier-bars').innerHTML = TIERS.map(t => {
    const count = albums.filter(a => getTier(a.score)?.id===t.id).length;
    const pct   = (count/maxTierCount*100).toFixed(1);
    return `<div class="tier-bar-row">
      <div class="tier-bar-label" style="color:${t.color}">${t.label}</div>
      <div class="tier-bar-track"><div class="tier-bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
      <div class="tier-bar-count">${count}</div>
    </div>`;
  }).join('');

  // artist leaderboard with avg score
  const sortedArtists = Object.entries(artistMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  document.getElementById('stats-artists').innerHTML = sortedArtists.map(([artist,count]) => {
    const artistAlbums = albums.filter(a => a.artist === artist);
    const avg = (artistAlbums.reduce((s,a) => s+a.score, 0) / artistAlbums.length).toFixed(2);
    const avgTier = getTier(parseFloat(avg));
    return `<div class="artist-row">
      <span>${escHtml(artist)}<span class="artist-avg" style="color:${avgTier.color}">${avg}</span></span>
      <span class="artist-count">${count} album${count>1?'s':''}</span>
    </div>`;
  }).join('');

  // year/decade bars
  const yearMap = {};
  albums.forEach(a => { if (a.year) { yearMap[a.year] = (yearMap[a.year]||0)+1; } });
  const years = Object.keys(yearMap).sort();
  const maxY  = Math.max(...Object.values(yearMap), 1);
  const yearEl = document.getElementById('stats-years');
  if (years.length) {
    yearEl.innerHTML = years.map(y =>
      `<div class="year-bar-wrap">
        <div class="year-bar" style="height:${Math.max(6,(yearMap[y]/maxY*70))}px;background:#3ac4b0" title="${y}: ${yearMap[y]}"></div>
        <div class="year-bar-label">${y}</div>
      </div>`
    ).join('');
  } else {
    yearEl.innerHTML = '<span style="color:var(--muted);font-size:10px">No year data</span>';
  }

  // genre breakdown
  const genreMap = {};
  albums.forEach(a => cleanGenres(a.genres).forEach(g => { genreMap[g]=(genreMap[g]||0)+1; }));
  const sortedGenres = Object.entries(genreMap).sort((a,b)=>b[1]-a[1]);
  const maxG = Math.max(...Object.values(genreMap),1);
  document.getElementById('stats-genres').innerHTML = sortedGenres.length
    ? sortedGenres.map(([g,c]) => `
        <div class="tier-bar-row">
          <div style="min-width:120px;font-size:11px">${escHtml(g)}</div>
          <div class="tier-bar-track"><div class="tier-bar-fill" style="width:${(c/maxG*100).toFixed(1)}%;background:#7b6de0"></div></div>
          <div class="tier-bar-count">${c}</div>
        </div>`).join('')
    : '<span style="color:var(--muted);font-size:10px">No genre data — add genres when editing albums</span>';
}

let scoreHistoryAlbum = null;

function openScoreHistory(album) {
  scoreHistoryAlbum = album;
  document.getElementById('scorehistory-album-name').textContent = `${album.title} — ${album.artist}`;
  renderScoreHistory();
  document.getElementById('sh-new-score').value = '';
  document.getElementById('scorehistory-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderScoreHistory() {
  const album = scoreHistoryAlbum;
  if (!album) return;
  if (!album.scoreHistory) album.scoreHistory = [];

  // Build timeline: original score is always the oldest entry if no history yet
  const entries = album.scoreHistory.length
    ? album.scoreHistory
    : [{ score: album.score, date: album.listenDate || album.addedAt && new Date(album.addedAt).toISOString().slice(0,10) || '?', label: 'Initial score' }];

  const timeline = document.getElementById('sh-timeline');
  timeline.innerHTML = '';

  entries.forEach((entry, i) => {
    const prev  = entries[i - 1];
    const delta = prev ? (entry.score - prev.score) : null;
    const tier  = getTier(entry.score);

    let deltaHtml = '';
    if (delta !== null) {
      const cls = delta > 0 ? 'up' : delta < 0 ? 'down' : 'same';
      const sign = delta > 0 ? '+' : '';
      deltaHtml = `<span class="sh-delta ${cls}">${sign}${delta.toFixed(2)}</span>`;
    }

    const div = document.createElement('div');
    div.className = 'sh-entry';
    div.style.setProperty('--sh-color', tier.color);
    div.innerHTML = `
      <div class="sh-dot"></div>
      <div class="sh-content">
        <div class="sh-date">${entry.date && entry.date !== '?' ? fmtDate(entry.date) : 'Unknown date'}</div>
        <div class="sh-score-row">
          <span class="sh-score">${entry.score}</span>
          <span class="sh-tier">${tier.label}</span>
          ${deltaHtml}
        </div>
        ${entry.label ? `<div class="sh-label">${escHtml(entry.label)}</div>` : ''}
      </div>`;
    timeline.appendChild(div);
  });
}

document.getElementById('sh-save-btn').addEventListener('click', () => {
  const album = scoreHistoryAlbum;
  if (!album) return;
  const newScore = parseFloat(document.getElementById('sh-new-score').value);
  if (isNaN(newScore) || newScore < 0 || newScore > 10) {
    alert('Enter a valid score between 0 and 10');
    return;
  }
  if (!album.scoreHistory) {
    // Bootstrap: store the current score as first entry
    album.scoreHistory = [{
      score: album.score,
      date: album.listenDate || (album.addedAt ? new Date(album.addedAt).toISOString().slice(0,10) : new Date().toISOString().slice(0,10)),
      label: 'Initial score'
    }];
  }
  const previousScore = Number(Number(album.score).toFixed(2));
  const previousEntry = album.scoreHistory[album.scoreHistory.length - 1];
  const occurredAt = new Date().toISOString();
  album.scoreHistory.push({
    score: newScore,
    date: occurredAt.slice(0,10),
    timestamp: occurredAt,
    label: ''
  });
  album.score = newScore;
  saveAlbumsWithAchievementEvents([makeAchievementEvent('album_rescored', album, { previous_score:previousScore, new_score:Number(Number(newScore).toFixed(2)), delta:Number((newScore-previousScore).toFixed(2)), previous_at:previousEntry?.timestamp || (previousEntry?.date ? new Date(previousEntry.date+'T00:00:00Z').toISOString() : null) })]);
  buildTiersWithReveal();
  document.getElementById('sh-new-score').value = '';
  renderScoreHistory();
  // also refresh the detail modal if open
  if (currentDetailAlbum && currentDetailAlbum.id === album.id) {
    openDetail(album);
    document.getElementById('scorehistory-backdrop').classList.add('open');
  }
